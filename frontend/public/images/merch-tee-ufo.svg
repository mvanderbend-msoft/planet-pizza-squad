<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- T-shirt -->
  <path d="M120 110 L160 80 Q200 110 240 80 L280 110 L320 150 L290 180 L275 165 L275 330 L125 330 L125 165 L110 180 L80 150 Z" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
  <!-- collar -->
  <path d="M160 80 Q200 130 240 80" fill="none" stroke="#0f172a" stroke-width="2"/>
  <!-- UFO graphic on tee -->
  <g transform="translate(200 230)">
    <ellipse cx="0" cy="20" rx="60" ry="10" fill="#10b981" opacity="0.4"/>
    <ellipse cx="0" cy="14" rx="55" ry="12" fill="#a78bfa"/>
    <path d="M-45 14 Q0 -22 45 14 Z" fill="#475569" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="0" cy="2" r="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="-20" cy="20" r="3" fill="#10b981"/>
    <circle cx="0" cy="22" r="3" fill="#a78bfa"/>
    <circle cx="20" cy="20" r="3" fill="#10b981"/>
    <!-- beam -->
    <path d="M-22 30 L-40 75 L40 75 L22 30 Z" fill="#10b981" opacity="0.25"/>
  </g>
  <text x="200" y="320" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="14" font-weight="700" fill="#10b981" letter-spacing="3">I SAW A UFO</text>
</svg>
