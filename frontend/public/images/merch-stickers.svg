<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Stack of round stickers, fanned out -->
  <g>
    <!-- back: cosmic purple -->
    <g transform="translate(140 260) rotate(-22)">
      <circle r="80" fill="#8b5cf6" stroke="#5b21b6" stroke-width="2"/>
      <text y="6" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="16" font-weight="900" fill="#ffffff">BELIEVE</text>
    </g>
    <!-- middle: alien green with face -->
    <g transform="translate(200 220)">
      <circle r="85" fill="#10b981" stroke="#047857" stroke-width="2"/>
      <ellipse cx="-20" cy="-5" rx="10" ry="18" fill="#0f172a"/>
      <ellipse cx="20" cy="-5" rx="10" ry="18" fill="#0f172a"/>
      <path d="M-12 25 q12 6 24 0" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- front: tinfoil hat sticker -->
    <g transform="translate(265 250) rotate(18)">
      <circle r="75" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
      <!-- hat icon -->
      <path d="M-30 15 Q0 -40 30 15 L25 22 L-25 22 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
      <path d="M-35 22 L35 22" stroke="#475569" stroke-width="2"/>
      <text y="50" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="11" font-weight="700" fill="#0f172a">TINFOIL</text>
    </g>
  </g>
</svg>
