  <circle cx="200" cy="200" r="135" fill="#fde68a"/>
  <!-- Sauce dollops -->
  <circle cx="155" cy="170" r="22" fill="#ef4444" opacity="0.85"/>
  <circle cx="240" cy="155" r="20" fill="#dc2626" opacity="0.85"/>
  <circle cx="220" cy="240" r="24" fill="#ef4444" opacity="0.85"/>
  <circle cx="150" cy="245" r="18" fill="#dc2626" opacity="0.85"/>
