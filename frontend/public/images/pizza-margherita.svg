    <ellipse cx="180" cy="140" rx="10" ry="16" transform="rotate(-30 180 140)"/>
    <ellipse cx="265" cy="200" rx="10" ry="16" transform="rotate(60 265 200)"/>
    <ellipse cx="190" cy="265" rx="10" ry="16" transform="rotate(15 190 265)"/>
    <ellipse cx="130" cy="200" rx="10" ry="16" transform="rotate(-70 130 200)"/>
