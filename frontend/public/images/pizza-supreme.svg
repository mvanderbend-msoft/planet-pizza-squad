<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fef9e7"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="155" fill="#d4a574" stroke="#a0764d" stroke-width="4"/>
  <circle cx="200" cy="200" r="135" fill="#fde68a"/>
  <circle cx="200" cy="200" r="130" fill="#ef4444" opacity="0.3"/>
  <!-- Pepperoni -->
  <g fill="#b91c1c" stroke="#7f1d1d" stroke-width="1">
    <circle cx="155" cy="160" r="16"/>
    <circle cx="235" cy="165" r="16"/>
    <circle cx="200" cy="250" r="16"/>
  </g>
  <!-- Sausage crumbles -->
  <g fill="#92400e">
    <circle cx="180" cy="195" r="7"/>
    <circle cx="225" cy="210" r="7"/>
    <circle cx="160" cy="225" r="6"/>
    <circle cx="260" cy="190" r="6"/>
    <circle cx="135" cy="195" r="6"/>
    <circle cx="245" cy="265" r="7"/>
  </g>
  <!-- Green peppers -->
  <g fill="#16a34a" stroke="#14532d" stroke-width="1">
    <path d="M195 145 q15 -10 26 0 q-5 12 -26 6 z"/>
    <path d="M150 240 q18 -8 28 4 q-8 12 -28 4 z"/>
    <path d="M250 235 q15 -8 25 4 q-6 12 -25 4 z"/>
  </g>
  <!-- Olives -->
  <g fill="#1f2937">
    <ellipse cx="200" cy="170" rx="7" ry="4"/>
    <ellipse cx="220" cy="245" rx="7" ry="4"/>
    <ellipse cx="170" cy="265" rx="7" ry="4"/>
    <ellipse cx="280" cy="220" rx="7" ry="4"/>
  </g>
  <!-- Mushrooms -->
  <g fill="#f5f5f4" stroke="#a8a29e" stroke-width="1">
    <path d="M125 175 q10 -12 22 -3 l-2 10 l-20 0 z"/>
    <path d="M195 280 q10 -12 22 -3 l-2 10 l-20 0 z"/>
  </g>
  <!-- Red onion -->
  <g stroke="#a21caf" stroke-width="2" fill="none" opacity="0.9">
    <path d="M260 145 q15 8 25 0"/>
    <path d="M130 250 q15 8 25 0"/>
  </g>
</svg>
