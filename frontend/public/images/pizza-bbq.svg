    <rect x="155" y="160" width="20" height="20" rx="3"/>
    <rect x="225" y="155" width="20" height="20" rx="3"/>
    <rect x="185" y="200" width="22" height="22" rx="3"/>
    <rect x="250" y="215" width="20" height="20" rx="3"/>
    <rect x="130" y="220" width="20" height="20" rx="3"/>
    <rect x="215" y="255" width="22" height="22" rx="3"/>
    <rect x="160" y="270" width="20" height="20" rx="3"/>
    <rect x="270" y="170" width="18" height="18" rx="3"/>
  </g>
  <!-- Red onion slivers -->
  <g stroke="#a21caf" stroke-width="2.5" fill="none">
    <path d="M140 195 q15 8 28 0"/>
    <path d="M205 240 q15 8 28 0"/>
    <path d="M165 250 q15 8 28 0"/>
    <path d="M245 195 q15 8 28 0"/>
