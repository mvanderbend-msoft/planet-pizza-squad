    <circle cx="155" cy="245" r="16"/>
  </g>
  <!-- Sausage chunks -->
  <g fill="#92400e">
    <circle cx="220" cy="160" r="10"/>
    <circle cx="190" cy="200" r="10"/>
    <circle cx="265" cy="190" r="9"/>
    <circle cx="200" cy="280" r="10"/>
    <circle cx="135" cy="200" r="9"/>
