<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fef9e7"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="155" fill="#d4a574" stroke="#a0764d" stroke-width="4"/>
  <circle cx="200" cy="200" r="135" fill="#fde68a"/>
  <!-- Green peppers -->
  <g fill="#16a34a" stroke="#14532d" stroke-width="1">
    <path d="M140 150 q15 -10 28 0 q-5 12 -28 8 z"/>
    <path d="M230 140 q18 -8 30 5 q-8 12 -30 5 z"/>
    <path d="M175 270 q20 -12 32 2 q-10 12 -32 6 z"/>
    <path d="M255 230 q15 -8 26 4 q-6 12 -26 4 z"/>
  </g>
  <!-- Black olives -->
  <g fill="#1f2937">
    <ellipse cx="190" cy="180" rx="10" ry="6"/>
    <ellipse cx="245" cy="195" rx="10" ry="6"/>
    <ellipse cx="160" cy="220" rx="10" ry="6"/>
    <ellipse cx="225" cy="255" rx="10" ry="6"/>
    <ellipse cx="280" cy="175" rx="9" ry="5"/>
    <circle cx="190" cy="180" r="2" fill="#fde68a"/>
    <circle cx="245" cy="195" r="2" fill="#fde68a"/>
    <circle cx="160" cy="220" r="2" fill="#fde68a"/>
    <circle cx="225" cy="255" r="2" fill="#fde68a"/>
  </g>
  <!-- Mushrooms (white slices) -->
  <g fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.2">
    <path d="M130 195 q10 -15 24 -5 l-2 12 l-22 0 z"/>
    <path d="M205 240 q10 -15 24 -5 l-2 12 l-22 0 z"/>
    <path d="M265 250 q10 -15 24 -5 l-2 12 l-22 0 z"/>
  </g>
  <!-- Red onion -->
  <g stroke="#a21caf" stroke-width="2" fill="none" opacity="0.9">
    <path d="M150 160 q15 8 25 0"/>
    <path d="M210 285 q15 8 25 0"/>
  </g>
</svg>
