<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Cap crown (front panel) -->
  <path d="M100 230 Q100 130 200 130 Q300 130 300 230 Z" fill="#0f172a" stroke="#020617" stroke-width="2"/>
  <!-- mesh back (right side fades) -->
  <path d="M200 130 Q300 130 300 230 L280 240 Q260 200 260 160 Q230 135 200 132 Z" fill="#1e293b" opacity="0.85"/>
  <!-- Brim -->
  <ellipse cx="200" cy="240" rx="135" ry="22" fill="#0f172a" stroke="#020617" stroke-width="2"/>
  <ellipse cx="200" cy="237" rx="130" ry="14" fill="#1e293b"/>
  <!-- Embroidered patch -->
  <rect x="155" y="160" width="90" height="50" rx="6" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
  <text x="200" y="180" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="11" font-weight="900" fill="#7c2d12">AREA 51</text>
  <text x="200" y="200" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="9" font-weight="700" fill="#10b981">PIZZA CO.</text>
  <!-- Snapback stitching -->
  <path d="M150 230 L150 145" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  <path d="M250 230 L250 145" stroke="#10b981" stroke-width="1" opacity="0.5"/>
</svg>
