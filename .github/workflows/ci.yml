name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend build
        working-directory: backend
        run: npm ci && npm run build
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
